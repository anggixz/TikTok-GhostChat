[package]
name = "tiktok-ghost-chat"
version = "1.0.0"
description = "TikTok Live Reader - Desktop App with Resizable Ghost Chat Mode"
authors = ["TikTok Live Reader Team"]
edition = "2021"

[lib]
name = "tiktok_ghost_chat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 0
